# Gradle configuration for the command line and for CI.
#
# The repository does not ship a Gradle wrapper, so CI installs Gradle and
# `gradle` is also what a local build uses. Run `gradle wrapper` once if you want
# `./gradlew` locally as well.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The Android plugin is not fully configuration-cache safe yet; leaving this off
# keeps CI deterministic instead of trading it for a small speed-up.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true
