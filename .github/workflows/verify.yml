name: Verify

# The verification this repository needs, in three layers:
#
#   1. `build`    — typecheck every workspace (core, design, web, mobile), run the
#                   parser tests, bundle the web app and the native app. No
#                   network: it fails fast on a type error and proves the mobile
#                   bundle actually compiles.
#   2. `e2e`      — drive the built web app in Chromium against the preview
#                   dataset. No network, so it is deterministic; it asserts the
#                   screens render, the player's chrome exists, the episode sheet
#                   opens and the download sheet has Select all + Export.
#   3. `smoke`    — start the real production server and walk the live catalogue:
#                   home → watch → servers → base64 → embed → downloads. This is
#                   the only place the upstream chain can be checked at all,
#                   because the development sandbox has no outbound sockets.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Parser tests
        run: npm test

      - name: Build the web app
        run: npm run build --workspace @anispots/web

      - name: Bundle the native app
        run: npx expo export --platform android --output-dir /tmp/native-bundle
        working-directory: apps/mobile

      - name: Icons are generated, not stale
        run: |
          npm run icons
          git diff --exit-code -- apps/mobile/assets

      - name: Production server starts
        run: |
          node -e "
            const { spawn } = require('node:child_process');
            const p = spawn(process.execPath, ['apps/web/server/proxy.mjs'], {
              env: { ...process.env, PORT: '4321', HOST: '127.0.0.1' },
            });
            let out = '';
            p.stdout.on('data', (d) => (out += d));
            p.stderr.on('data', (d) => (out += d));
            setTimeout(async () => {
              try {
                const r = await fetch('http://127.0.0.1:4321/');
                console.log('GET /', r.status);
                if (r.status !== 200) throw new Error('server did not serve the app:\n' + out);
                p.kill();
                process.exit(0);
              } catch (e) {
                console.error(e.message, out);
                p.kill();
                process.exit(1);
              }
            }, 1200);
          "

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Render the app in a browser
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install a browser
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build with the preview dataset
        run: npm run build:demo --workspace @anispots/web

      - name: Drive every screen
        env:
          REQUIRE_E2E: "1"
        run: node tools/e2e/web.mjs

  smoke:
    name: Walk the live chain
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build --workspace @anispots/web

      - name: Smoke the whole chain through the production server
        run: node tools/smoke/smoke.mjs --port 4321
