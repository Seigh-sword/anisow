name: Verify

# The verification this repository actually needs.
#
# The development sandbox has no outbound sockets, so anything that touches the
# catalogue can only be checked here — and that is the part that breaks. This
# workflow runs in two layers:
#
#   1. `build`  — typecheck every workspace, run the parser tests, build the web
#                 app. No network: fast, and it fails the run on a type error.
#   2. `smoke`  — start the real production server and walk the whole chain:
#                 home → watch → servers → base64 → embed → downloads. Network
#                 required, so it is allowed to be flaky on the far side but not
#                 on ours (the proxy contract is asserted too).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Parser tests
        run: npm test

      - name: Build the web app
        run: npm run build --workspace @anispots/web

      - name: Production server starts
        run: |
          node -e "
            const { spawn } = require('node:child_process');
            const p = spawn(process.execPath, ['apps/web/server/proxy.mjs'], {
              env: { ...process.env, PORT: '4321', HOST: '127.0.0.1' },
            });
            let out = '';
            p.stdout.on('data', (d) => (out += d));
            p.stderr.on('data', (d) => (out += d));
            setTimeout(async () => {
              try {
                const r = await fetch('http://127.0.0.1:4321/');
                console.log('GET /', r.status);
                if (r.status !== 200) throw new Error('server did not serve the app:\n' + out);
                p.kill();
                process.exit(0);
              } catch (e) {
                console.error(e.message, out);
                p.kill();
                process.exit(1);
              }
            }, 1200);
          "

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  smoke:
    name: Walk the live chain
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build --workspace @anispots/web

      - name: Smoke the whole chain through the production server
        run: node tools/smoke/smoke.mjs --port 4321
