name: Desktop

# The desktop installers.
#
# One job per operating system, then one job that collects the artefacts and
# publishes them to a GitHub release. Each installer is a real, runnable file
# — nothing is shipped as a .zip:
#
#   Windows   AniSpots-<version>-x64-setup.exe   the graphical installer
#              AniSpots-<version>-x64.msi          the Windows Installer package
#   Linux     AniSpots-<version>-x64.deb          the Debian package
#              AniSpots-<version>-x64.AppImage     runs from the file
#   macOS     AniSpots-<version>-<arch>.dmg       the disk image
#
# The release is a draft: it is published by hand once the artefacts have been
# checked over, so a broken build never reaches a user's download button.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            platform: win
            arch: x64
          - label: Linux (x64)
            os: ubuntu-latest
            platform: linux
            arch: x64
          - label: macOS (arm64)
            os: macos-latest
            platform: mac
            arch: arm64
          - label: macOS (x64)
            os: macos-latest
            platform: mac
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check the Electron runtime
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = path.dirname(require.resolve('electron/package.json'));
            const file = path.join(dir, 'path.txt');
            if (!fs.existsSync(file)) throw new Error('the Electron binary was not installed');
            console.log('electron at', path.join(dir, 'dist', fs.readFileSync(file, 'utf8')));
          "

      - name: Build the web app
        run: npm run build --workspace @anispots/web

      - name: Build the installer
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        working-directory: apps/desktop
        env:
          # The build needs no secrets; the release job does.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain a failure
        if: failure()
        run: |
          # The build log is not always in the step output, so the dist folder
          # is listed to show how far it got.
          ls -la apps/desktop/dist 2>/dev/null || echo "nothing was produced"
          ls -la node_modules/electron/dist 2>/dev/null | head -5 || echo "no electron dist"

      - name: Collect the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: anispots-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download the artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: List what will be published
        run: ls -la artefacts/

      - name: Publish to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artefacts/*
          body: |
            ## AniSpots ${{ github.ref_name }}

            | Platform | File | What it is |
            | --- | --- | --- |
            | Windows | `AniSpots-*-x64-setup.exe` | The graphical installer. One wizard, no archive to unpack. |
            | Windows | `AniSpots-*-x64.msi` | The Windows Installer package. |
            | Linux | `AniSpots-*-x64.deb` | The Debian / Ubuntu package. |
            | Linux | `AniSpots-*-x64.AppImage` | Runs straight from the file. |
            | macOS | `AniSpots-*-arm64.dmg` | The Apple Silicon disk image. |
            | macOS | `AniSpots-*-x64.dmg` | The Intel disk image. |

            The app keeps its data in `%APPDATA%\anispot` on Windows,
            `~/Library/Application Support/anispot` on macOS and
            `~/.config/anispot` on Linux — the same folder the installer
            creates.
