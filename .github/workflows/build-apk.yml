name: Build APK

# Builds an installable debug APK and keeps it as a downloadable artifact.
#
# A debug APK is signed with the debug keystore the Android plugin generates, so
# there is nothing to configure: download the artifact, install it on a phone.
#
# Failures are echoed as annotations (`::error::`) on purpose: annotations are
# readable through the API, while raw job logs are not always reachable.

on:
  push:
    branches:
      - main
      - arena/eb1f41c1-anisow
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Mapped here rather than in the step so the step's `if` can read it: the
    # secrets context is not available in a step condition.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          set -o pipefail
          {
            yes | sdkmanager --licenses
            sdkmanager --install "platforms;android-$ANDROID_API" "build-tools;$BUILD_TOOLS" "platform-tools"
          } > sdk.log 2>&1 || {
            tail -n 20 sdk.log | while IFS= read -r line; do echo "::error::SDK: $line"; done
            exit 1
          }
          tail -n 5 sdk.log

      # The repository ships no Gradle wrapper, so the action provides Gradle.
      # gradle-version must be quoted or YAML reads it as a number.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain > build.log 2>&1 || {
            # Surface compiler errors as annotations: those are the lines worth
            # reading, and the full log stays in the run.
            grep -E "^e: |^w: .*(error|deprecat)|error:|FAILURE:|Caused by:" build.log \
              | head -n 25 \
              | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 40 build.log
            exit 1
          }
          tail -n 8 build.log

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::assembleDebug produced no APK"
            exit 1
          fi
          NAME="anilab-debug-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anilab-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # The full logs are the useful artifact on a red build.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            sdk.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
