name: Build APK

# Builds an installable debug APK and keeps it as a downloadable artifact.
#
# A debug APK is signed with the debug keystore the Android plugin generates, so
# there is nothing to configure: download the artifact, install it on a phone.
# Release signing would need a keystore secret and is deliberately left out.

on:
  push:
    branches:
      - main
      - arena/eb1f41c1-anisow
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Firebase config is per environment. Mapping the secret here (not in
    # the step) is what lets the step's `if` read it: the secrets context is
    # not available in a step condition.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP needs the exact platform and build tools; the runner image does not
      # guarantee the API level this project compiles against.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      # The repository ships no Gradle wrapper, so the action provides Gradle.
      # gradle-version must be quoted or YAML reads it as a number.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "assembleDebug produced no APK" >&2
            exit 1
          fi
          NAME="anilab-debug-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anilab-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Compiler output is what a failed build needs; the HTML reports add the
      # resource and lint detail that the log truncates.
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
